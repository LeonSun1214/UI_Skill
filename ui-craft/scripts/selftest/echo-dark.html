<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo dark</title>
<style>
  /* Vuetify generates variables for its built-in dark theme; the app root keeps its own theme, so a dark
     class on <html> changes nothing on the page. */
  .v-theme--dark { color-scheme: dark; --v-theme-background: 18, 18, 18; }
  body { margin: 0; padding: 32px; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .app { background: #fff; color: #1a1a1a; }
  .faint { color: #a8a8a8; }
</style>
</head>
<body>
<div class="app v-theme--light">
  <main>
    <h1>Echo dark</h1>
    <p class="faint">Faint caption under the heading.</p>
  </main>
</div>
</body>
</html>
