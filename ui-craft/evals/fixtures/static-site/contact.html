<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Harbor Coffee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
  <script>
    // The stored choice, or the OS, decides the theme before the first paint.
    const saved = localStorage.getItem('site-theme');
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-md container">
      <a class="navbar-brand brand" href="index.html">Harbor Coffee</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Contact</h1>
    <form class="contact-form">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email">
      <label class="form-label" for="msg">Message</label>
      <textarea class="form-control" id="msg" name="msg"></textarea>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer">
    <div class="container"><p class="muted">Harbor Coffee · 12 Pier Road · Open 7–18 · Closed on holidays</p></div>
  </footer>
  <script src="vendor/alpine/alpine.min.js" defer></script>
</body>
</html>
