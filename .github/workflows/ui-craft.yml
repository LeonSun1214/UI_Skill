  flutter:
    # flutter_render.mjs on the fixture with the current stable Flutter: every planted defect found, with its
    # file and line, in the pass it belongs to; then signing in through the form and opening a route.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui-craft/scripts/package-lock.json }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Install runtime
        working-directory: ui-craft/scripts
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: flutter_render.mjs finds the planted defects
        run: |
          cp -r ui-craft/evals/fixtures/flutter-app /tmp/trailhead
          node ui-craft/scripts/flutter_render.mjs /tmp/trailhead --prefs signed_in=true --out /tmp/fr | tee /tmp/fr.txt
          grep -q "location /trips" /tmp/fr.txt
          grep -q "overflow: by .* on the right — lib/screens/trips_screen.dart:17 (Row) · at 375, 375 dark, 375 text 200%" /tmp/fr.txt
          grep -q "on the bottom — lib/widgets/trip_card.dart:37 (Column) · at 375 text 200%" /tmp/fr.txt
          grep -q "#9E9E9E on #FFFFFF, 12px — lib/widgets/trip_card.dart:41 (Text)" /tmp/fr.txt
          grep -q "#4A4A4A on #121212, 14px — lib/widgets/trip_card.dart:42 (Text) · at 375 dark, 768 dark, 1440 dark" /tmp/fr.txt
          grep -q "unlabeled: 28×28 tappable with no label — lib/widgets/trip_card.dart:49 (GestureDetector)" /tmp/fr.txt
          grep -q "unlabeled: 48×48 button with no label — lib/screens/trips_screen.dart:25 (IconButton)" /tmp/fr.txt
          grep -q "target: 28×28 tappable (below 44pt and 48dp) — lib/widgets/trip_card.dart:49" /tmp/fr.txt
