name: ui-craft
on:
  push:
    paths: ["ui-craft/**", ".github/workflows/ui-craft.yml"]
  pull_request:
    paths: ["ui-craft/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui-craft/scripts/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: One version everywhere (frontmatter, the Version line, the changelog)
        run: |
          fm=$(sed -n 's/^  version: //p' ui-craft/SKILL.md | head -1)
          body=$(sed -n 's/^Version \([0-9.]*[0-9]\)\..*/\1/p' ui-craft/SKILL.md | head -1)
          log=$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' ui-craft/CHANGELOG.md | head -1)
          echo "frontmatter $fm · Version line $body · changelog $log"
          test -n "$fm" && test "$fm" = "$body" && test "$fm" = "$log"
      - name: Syntax
        run: |
          for f in ui-craft/scripts/*.mjs ui-craft/scripts/lib/*.mjs; do node --check "$f"; done
          python3 -m py_compile ui-craft/scripts/inspect.py ui-craft/scripts/contrast.py ui-craft/evals/*.py
      - name: Install runtime
        working-directory: ui-craft/scripts
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Doctor
        working-directory: ui-craft/scripts
        run: node doctor.mjs
      - name: Self-test (instruments + real-project options)
        working-directory: ui-craft/scripts
        run: node selftest.mjs
      - name: verify.py catches the planted facts (5 FAILs expected)
        run: |
          (cd ui-craft/evals/fixtures && npm ci --no-audit --no-fund)
          python3 ui-craft/scripts/verify.py ui-craft/evals/fixtures/facts-test | tee /tmp/facts.txt
          test "$(grep -c '^FAIL' /tmp/facts.txt)" = "5"
      - name: direction.py finds the planted contrast failures and fixes them
        run: |
          cp ui-craft/scripts/selftest/brief.json /tmp/brief.json
          if python3 ui-craft/scripts/direction.py check /tmp/brief.json > /tmp/dir.txt; then echo "expected FAILs"; exit 1; fi
          test "$(grep -c '^FAIL' /tmp/dir.txt)" = "4"
          python3 ui-craft/scripts/direction.py check /tmp/brief.json --fix | tail -1 | grep -q "0 below minimum"
          python3 ui-craft/scripts/direction.py write /tmp/brief.json --css /tmp/index.css --doc /tmp/DIRECTION.md | tail -1
          grep -q "ui-craft:tokens" /tmp/index.css && grep -q "Measured contrast" /tmp/DIRECTION.md
      - name: contrast.py and inspect.py on the fixtures
        run: |
          python3 ui-craft/scripts/contrast.py '#6b615b' '#fbf8f3'
          python3 ui-craft/scripts/contrast.py --css ui-craft/evals/fixtures/established/src/index.css --text ink,muted,brand --on surface,panel
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/established | tee /tmp/inspect.txt | head -20
          grep -q "## Start here" /tmp/inspect.txt
          grep -q "settings/profile" /tmp/inspect.txt   # the route table found the nested Route
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/nextjs | tee /tmp/inspect-next.txt | grep -q "app/page.tsx"
          grep -q "app/layout.tsx. wraps every page" /tmp/inspect-next.txt   # the App Router layout is on the reading list
          # Nuxt 4 + Nuxt UI: file routes under app/, layouts and who uses them, middleware, server API, Nuxt UI's vocabulary
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/nuxt-app | tee /tmp/inspect-nuxt.txt | head -5
          grep -q "file routes in app/pages/" /tmp/inspect-nuxt.txt
          grep -q "/settings/profile. → app/pages/settings/profile.vue" /tmp/inspect-nuxt.txt
          grep -q "layouts/dashboard.vue. wraps the pages that set .layout: 'dashboard'. (1: profile.vue)" /tmp/inspect-nuxt.txt
          grep -q "middleware/auth.ts. runs before the pages that name it: profile.vue — it can redirect" /tmp/inspect-nuxt.txt
          grep -q "server/api. answers 2 routes" /tmp/inspect-nuxt.txt
          grep -q "Nuxt UI — colours .primary: emerald." /tmp/inspect-nuxt.txt
          grep -q "dashboard/Sidebar.vue. (1; props collapsed, items)" /tmp/inspect-nuxt.txt
          grep -q "localStorage .nuxt-color-mode." /tmp/inspect-nuxt.txt
          grep -q "references/stacks/nuxt.md" /tmp/inspect-nuxt.txt
          # Vue + vue-router: the route table, the layout a view sits in, props from both defineProps forms
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/vue-app | tee /tmp/inspect-vue.txt | head -5
          grep -q "/settings. → src/views/SettingsView.vue" /tmp/inspect-vue.txt
          grep -q "inside AppLayout" /tmp/inspect-vue.txt
          grep -q "StatCard.vue. (2; props label, value)" /tmp/inspect-vue.txt
          grep -q "BaseButton.vue. (2; props variant, size)" /tmp/inspect-vue.txt
          grep -q "localStorage .fixture-theme." /tmp/inspect-vue.txt
          grep -q "references/stacks/vue.md" /tmp/inspect-vue.txt
          # SvelteKit: file routes with groups, the layouts and what they load, the hook's guard, endpoints, $props, mode-watcher
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/sveltekit-app | tee /tmp/inspect-sk.txt | head -5
          grep -q "SvelteKit .*(file routes in src/routes/)" /tmp/inspect-sk.txt
          grep -q "/reports. → src/routes/(app)/reports/+page.svelte" /tmp/inspect-sk.txt
          grep -q "(app)/+layout.svelte. wraps the pages in .(app)." /tmp/inspect-sk.txt
          grep -q "loads data for every page below (.+layout.server.ts.)" /tmp/inspect-sk.txt
          grep -q "hooks.server.ts. runs before every request: guards ./settings." /tmp/inspect-sk.txt
          grep -q "endpoints (.+server.ts.): ./api/reports." /tmp/inspect-sk.txt
          grep -q "Button.svelte. (4; props variant, size, href, children)" /tmp/inspect-sk.txt
          grep -q "form actions" /tmp/inspect-sk.txt
          grep -q "set before paint by mode-watcher" /tmp/inspect-sk.txt
          grep -q "references/stacks/sveltekit.md" /tmp/inspect-sk.txt
          # Astro: file routes, the layout a page sits in, collections, islands, middleware, plain-CSS dark mode and its boot script
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/astro-app | tee /tmp/inspect-astro.txt | head -5
          grep -q "Astro .*(file routes in src/pages/).*integrations mdx, sitemap, react" /tmp/inspect-astro.txt
          grep -q "/blog/\[...slug\]. → src/pages/blog/\[...slug\].astro" /tmp/inspect-astro.txt
          grep -q "inside Layout (.src/layouts/BlogPost.astro." /tmp/inspect-astro.txt
          grep -q "islands Newsletter (client:visible)" /tmp/inspect-astro.txt
          grep -q "content collections in .src/content.config.ts.: .blog. from ../src/content/blog., .notes." /tmp/inspect-astro.txt
          grep -q "middleware.ts. runs before every request: guards ./drafts." /tmp/inspect-astro.txt
          grep -q "under .\[data-theme=dark\]. on .<html>. — .src/styles/global.css" /tmp/inspect-astro.txt
          grep -q "inline script in .src/components/BaseHead.astro. (localStorage .theme.)" /tmp/inspect-astro.txt
          grep -q "BaseHead.astro. (3; props title, description)" /tmp/inspect-astro.txt
          grep -q "references/stacks/astro.md" /tmp/inspect-astro.txt
          # Angular: the route table (lazy components, a lazy NgModule, default-export routes), the layout with an
          # outlet, guards and the session they read, the requests a page makes, the Material theme, the theme class
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/angular-app | tee /tmp/inspect-ng.txt | head -5
          grep -q "Angular .*(standalone components; routes in .src/app/app.routes.ts.) · UI: Angular Material" /tmp/inspect-ng.txt
          grep -q "dashboard.component.ts. · ./dashboard. (lazy) · template .dashboard.component.html., 34 lines" /tmp/inspect-ng.txt
          grep -q "data: GET ./api/stats. (Orders.stats)" /tmp/inspect-ng.txt
          grep -q "inside ShellComponent (.src/app/shell/shell.component.ts." /tmp/inspect-ng.txt
          grep -q "./admin/audit. → AuditLogComponent (lazy)" /tmp/inspect-ng.txt
          grep -q "./reports. → ReportsPage (lazy)" /tmp/inspect-ng.txt
          grep -q "guard .AdminGuard. (.src/app/admin/admin.guard.ts.) runs before ./admin/audit.; it can redirect to ./login." /tmp/inspect-ng.txt
          grep -q "needs a session: localStorage .ng-demo-token. (.src/app/auth/auth.service.ts.)" /tmp/inspect-ng.txt
          grep -q "stat-card.ts. .<app-stat-card>. (2; inputs label (required), value, unit, trend; outputs selected)" /tmp/inspect-ng.txt
          grep -q "M3 theme at .src/styles.scss:10. (primary .azure., tertiary .blue." /tmp/inspect-ng.txt
          grep -q "under .\.dark-theme. on .<html>." /tmp/inspect-ng.txt
          grep -q "render dark through it: .--dark-storage ng-demo-theme=dark." /tmp/inspect-ng.txt
          grep -q "proxy.conf.json. proxies ./api. → .http://localhost:3000." /tmp/inspect-ng.txt
          grep -q "ng serve. listens on :4200" /tmp/inspect-ng.txt
          grep -q "references/stacks/angular.md" /tmp/inspect-ng.txt
