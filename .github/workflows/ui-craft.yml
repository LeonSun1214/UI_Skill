name: ui-craft
on:
  push:
    paths: ["ui-craft/**", ".github/workflows/ui-craft.yml"]
  pull_request:
    paths: ["ui-craft/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui-craft/scripts/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: One version everywhere (frontmatter, the Version line, the changelog)
        run: |
          fm=$(sed -n 's/^  version: //p' ui-craft/SKILL.md | head -1)
          body=$(sed -n 's/^Version \([0-9.]*[0-9]\)\..*/\1/p' ui-craft/SKILL.md | head -1)
          log=$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' ui-craft/CHANGELOG.md | head -1)
          echo "frontmatter $fm · Version line $body · changelog $log"
          test -n "$fm" && test "$fm" = "$body" && test "$fm" = "$log"
      - name: Syntax
        run: |
          for f in ui-craft/scripts/*.mjs ui-craft/scripts/lib/*.mjs; do node --check "$f"; done
          python3 -m py_compile ui-craft/scripts/inspect.py ui-craft/scripts/contrast.py ui-craft/evals/*.py
      - name: Install runtime
        working-directory: ui-craft/scripts
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Doctor
        working-directory: ui-craft/scripts
        run: node doctor.mjs
      - name: Self-test (instruments + real-project options)
        working-directory: ui-craft/scripts
        run: node selftest.mjs
      - name: verify.py catches the planted facts (5 FAILs expected)
        run: |
          (cd ui-craft/evals/fixtures && npm ci --no-audit --no-fund)
          python3 ui-craft/scripts/verify.py ui-craft/evals/fixtures/facts-test | tee /tmp/facts.txt
          test "$(grep -c '^FAIL' /tmp/facts.txt)" = "5"
      - name: direction.py finds the planted contrast failures and fixes them
        run: |
          cp ui-craft/scripts/selftest/brief.json /tmp/brief.json
          if python3 ui-craft/scripts/direction.py check /tmp/brief.json > /tmp/dir.txt; then echo "expected FAILs"; exit 1; fi
          test "$(grep -c '^FAIL' /tmp/dir.txt)" = "4"
          python3 ui-craft/scripts/direction.py check /tmp/brief.json --fix | tail -1 | grep -q "0 below minimum"
          python3 ui-craft/scripts/direction.py write /tmp/brief.json --css /tmp/index.css --doc /tmp/DIRECTION.md | tail -1
          grep -q "ui-craft:tokens" /tmp/index.css && grep -q "Measured contrast" /tmp/DIRECTION.md
      - name: contrast.py and inspect.py on the fixtures
        run: |
          python3 ui-craft/scripts/contrast.py '#6b615b' '#fbf8f3'
          python3 ui-craft/scripts/contrast.py --css ui-craft/evals/fixtures/established/src/index.css --text ink,muted,brand --on surface,panel
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/established | tee /tmp/inspect.txt | head -20
          grep -q "## Start here" /tmp/inspect.txt
          grep -q "settings/profile" /tmp/inspect.txt   # the route table found the nested Route
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/nextjs | tee /tmp/inspect-next.txt | grep -q "app/page.tsx"
          grep -q "app/layout.tsx. wraps every page" /tmp/inspect-next.txt   # the App Router layout is on the reading list
          # Nuxt 4 + Nuxt UI: file routes under app/, layouts and who uses them, middleware, server API, Nuxt UI's vocabulary
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/nuxt-app | tee /tmp/inspect-nuxt.txt | head -5
          grep -q "file routes in app/pages/" /tmp/inspect-nuxt.txt
          grep -q "/settings/profile. → app/pages/settings/profile.vue" /tmp/inspect-nuxt.txt
          grep -q "layouts/dashboard.vue. wraps the pages that set .layout: 'dashboard'. (1: profile.vue)" /tmp/inspect-nuxt.txt
          grep -q "middleware/auth.ts. runs before the pages that name it: profile.vue — it can redirect" /tmp/inspect-nuxt.txt
          grep -q "server/api. answers 2 routes" /tmp/inspect-nuxt.txt
          grep -q "Nuxt UI — colours .primary: emerald." /tmp/inspect-nuxt.txt
          grep -q "dashboard/Sidebar.vue. (1; props collapsed, items)" /tmp/inspect-nuxt.txt
          grep -q "localStorage .nuxt-color-mode." /tmp/inspect-nuxt.txt
          grep -q "references/stacks/nuxt.md" /tmp/inspect-nuxt.txt
          # Vue + vue-router: the route table, the layout a view sits in, props from both defineProps forms
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/vue-app | tee /tmp/inspect-vue.txt | head -5
          grep -q "/settings. → src/views/SettingsView.vue" /tmp/inspect-vue.txt
          grep -q "inside AppLayout" /tmp/inspect-vue.txt
          grep -q "StatCard.vue. (2; props label, value)" /tmp/inspect-vue.txt
          grep -q "BaseButton.vue. (2; props variant, size)" /tmp/inspect-vue.txt
          grep -q "localStorage .fixture-theme." /tmp/inspect-vue.txt
          grep -q "references/stacks/vue.md" /tmp/inspect-vue.txt
          # SvelteKit: file routes with groups, the layouts and what they load, the hook's guard, endpoints, $props, mode-watcher
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/sveltekit-app | tee /tmp/inspect-sk.txt | head -5
          grep -q "SvelteKit .*(file routes in src/routes/)" /tmp/inspect-sk.txt
          grep -q "/reports. → src/routes/(app)/reports/+page.svelte" /tmp/inspect-sk.txt
          grep -q "(app)/+layout.svelte. wraps the pages in .(app)." /tmp/inspect-sk.txt
          grep -q "loads data for every page below (.+layout.server.ts.)" /tmp/inspect-sk.txt
          grep -q "hooks.server.ts. runs before every request: guards ./settings." /tmp/inspect-sk.txt
          grep -q "endpoints (.+server.ts.): ./api/reports." /tmp/inspect-sk.txt
          grep -q "Button.svelte. (4; props variant, size, href, children)" /tmp/inspect-sk.txt
          grep -q "form actions" /tmp/inspect-sk.txt
          grep -q "set before paint by mode-watcher" /tmp/inspect-sk.txt
          grep -q "references/stacks/sveltekit.md" /tmp/inspect-sk.txt
          # Astro: file routes, the layout a page sits in, collections, islands, middleware, plain-CSS dark mode and its boot script
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/astro-app | tee /tmp/inspect-astro.txt | head -5
          grep -q "Astro .*(file routes in src/pages/).*integrations mdx, sitemap, react" /tmp/inspect-astro.txt
          grep -q "/blog/\[...slug\]. → src/pages/blog/\[...slug\].astro" /tmp/inspect-astro.txt
          grep -q "inside Layout (.src/layouts/BlogPost.astro." /tmp/inspect-astro.txt
          grep -q "islands Newsletter (client:visible)" /tmp/inspect-astro.txt
          grep -q "content collections in .src/content.config.ts.: .blog. from ../src/content/blog., .notes." /tmp/inspect-astro.txt
          grep -q "middleware.ts. runs before every request: guards ./drafts." /tmp/inspect-astro.txt
          grep -q "under .\[data-theme=dark\]. on .<html>. — .src/styles/global.css" /tmp/inspect-astro.txt
          grep -q "inline script in .src/components/BaseHead.astro. (localStorage .theme.)" /tmp/inspect-astro.txt
          grep -q "BaseHead.astro. (3; props title, description)" /tmp/inspect-astro.txt
          grep -q "references/stacks/astro.md" /tmp/inspect-astro.txt
          # Angular: the route table (lazy components, a lazy NgModule, default-export routes), the layout with an
          # outlet, guards and the session they read, the requests a page makes, the Material theme, the theme class
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/angular-app | tee /tmp/inspect-ng.txt | head -5
          grep -q "Angular .*(standalone components; routes in .src/app/app.routes.ts.) · UI: Angular Material" /tmp/inspect-ng.txt
          grep -q "dashboard.component.ts. · ./dashboard. (lazy) · template .dashboard.component.html., 34 lines" /tmp/inspect-ng.txt
          grep -q "data: GET ./api/stats. (Orders.stats)" /tmp/inspect-ng.txt
          grep -q "inside ShellComponent (.src/app/shell/shell.component.ts." /tmp/inspect-ng.txt
          grep -q "./admin/audit. → AuditLogComponent (lazy)" /tmp/inspect-ng.txt
          grep -q "./reports. → ReportsPage (lazy)" /tmp/inspect-ng.txt
          grep -q "guard .AdminGuard. (.src/app/admin/admin.guard.ts.) runs before ./admin/audit.; it can redirect to ./login." /tmp/inspect-ng.txt
          grep -q "needs a session: localStorage .ng-demo-token. (.src/app/auth/auth.service.ts.)" /tmp/inspect-ng.txt
          grep -q "stat-card.ts. .<app-stat-card>. (2; inputs label (required), value, unit, trend; outputs selected)" /tmp/inspect-ng.txt
          grep -q "M3 theme at .src/styles.scss:10. (primary .azure., tertiary .blue." /tmp/inspect-ng.txt
          grep -q "under .\.dark-theme. on .<html>." /tmp/inspect-ng.txt
          grep -q "render dark through it: .--dark-storage ng-demo-theme=dark." /tmp/inspect-ng.txt
          grep -q "proxy.conf.json. proxies ./api. → .http://localhost:3000." /tmp/inspect-ng.txt
          grep -q "ng serve. listens on :4200" /tmp/inspect-ng.txt
          grep -q "references/stacks/angular.md" /tmp/inspect-ng.txt
          # A hand-written site: its pages, the chrome copied into each, the kit from a CDN, the boot theme script
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/static-site | tee /tmp/inspect-static.txt | head -5
          grep -q "static HTML · Bootstrap 5.3.3 (CDN) · Alpine.js" /tmp/inspect-static.txt
          grep -q "4 pages in the root, no templates: shared markup is copied into each page" /tmp/inspect-static.txt
          grep -q "the header .header.site-header. is in 4 of 4 pages, identical in all" /tmp/inspect-static.txt
          grep -q "the footer .footer.site-footer. is in 4 of 4 pages, identical in 3" /tmp/inspect-static.txt
          grep -q "contact.html. · ./contact.html. · “Contact · Harbor Coffee” · 45 lines · form, 3 fields" /tmp/inspect-static.txt
          grep -q "python3 -m http.server 8000" /tmp/inspect-static.txt
          grep -q "references/stacks/static.md" /tmp/inspect-static.txt
          grep -q "UI kit: .*Bootstrap 5.3.3 (CDN).* build with its classes" /tmp/inspect-static.txt
          # Eleventy: dir config, permalinks, directory data (layout and tags), layout chains, site data, not the feed
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/eleventy-site | tee /tmp/inspect-11ty.txt | head -5
          grep -q "Eleventy: pages from .src/., layouts in .src/_includes/." /tmp/inspect-11ty.txt
          grep -q "src/about.md. · ./about-us/." /tmp/inspect-11ty.txt
          grep -q "first-light.md. · ./blog/first-light/. · “First light” · 6 lines · tag .posts. · inside layouts/post.njk → layouts/base.njk" /tmp/inspect-11ty.txt
          grep -q "site data: .site." /tmp/inspect-11ty.txt
          if grep -q "feed.xml" /tmp/inspect-11ty.txt; then echo "the feed is not a page"; exit 1; fi
          # Jekyll: pretty permalinks for posts and pages, defaults, layout chains, includes, Sass with front matter, gems,
          # Sass variables as the declared tokens, and a site with layouts is matched, not greenfield
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/jekyll-site | tee /tmp/inspect-jekyll.txt | head -5
          grep -q "reefing-early.md. · ./2026/04/11/reefing-early/. · “Reefing early” · 5 lines · inside post.html → default.html" /tmp/inspect-jekyll.txt
          grep -q "about.md. · ./about/." /tmp/inspect-jekyll.txt
          grep -q "styles: .assets/main.scss., which Jekyll compiles" /tmp/inspect-jekyll.txt
          grep -q "_layouts/default.html. wraps 3 pages: chrome header.html, footer.html" /tmp/inspect-jekyll.txt
          grep -q "gem install jekyll jekyll-feed jekyll-seo-tag webrick kramdown-parser-gfm" /tmp/inspect-jekyll.txt
          grep -q "### Sass variables in _sass/_base.scss" /tmp/inspect-jekyll.txt
          grep -q "Established conventions detected" /tmp/inspect-jekyll.txt
          # MUI: a createBrowserRouter table (a guard, a layout, a thin page through a barrel), the theme's palette,
          # radius, fonts, overrides and color schemes, useColorScheme's key, no Tailwind counts
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/mui-app | tee /tmp/inspect-mui.txt | head -5
          grep -q "MUI — its components by use" /tmp/inspect-mui.txt
          grep -q "settings.tsx. · ./settings. · 19 lines · inside DashboardLayout · behind RequireAuth" /tmp/inspect-mui.txt
          grep -q "dashboard.tsx. · ./. .*renders DashboardView (.src/sections/overview/overview-view.tsx" /tmp/inspect-mui.txt
          grep -q "palette: primary #0f766e · secondary #b45309" /tmp/inspect-mui.txt
          grep -q "shape.borderRadius 10 · fonts Inter · color schemes: light, dark (selector .class.)" /tmp/inspect-mui.txt
          grep -q "component overrides (1): MuiButton" /tmp/inspect-mui.txt
          grep -q "render dark with .--dark-storage mui-mode=dark." /tmp/inspect-mui.txt
          grep -q "not a Tailwind project" /tmp/inspect-mui.txt
          grep -q "loaded from npm (no network needed): .@fontsource/inter." /tmp/inspect-mui.txt
          # Ant Design Pro on umi: config/routes.ts (access, a redirect, layout: false), tokens from the umi config and
          # ProLayout settings, darkAlgorithm, umi's dev server; a page's component folder is not a page
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/antd-app | tee /tmp/inspect-antd.txt | head -5
          grep -q "Umi · React" /tmp/inspect-antd.txt
          grep -q "Ant Design (with Pro components" /tmp/inspect-antd.txt
          grep -q "admin/users/index.tsx. · ./admin/users. · 13 lines · inside the umi layout (ProLayout) · behind access canAdmin" /tmp/inspect-antd.txt
          grep -q "(redirect → ./welcome.)" /tmp/inspect-antd.txt
          grep -q "tokens: colorPrimary #7c3aed · navTheme light · layout mix · borderRadius 8" /tmp/inspect-antd.txt
          grep -q "Ant Design's .darkAlgorithm." /tmp/inspect-antd.txt
          grep -q "max dev. listens on :8000" /tmp/inspect-antd.txt
          if grep -q "components/UpdateForm.tsx. · " /tmp/inspect-antd.txt; then echo "a component folder is not a page"; exit 1; fi
          # Chakra v2: a routes.js menu table under splat layouts, the theme's scales and component styles, the color mode key
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/chakra-app | tee /tmp/inspect-chakra.txt | head -5
          grep -q "views/admin/default/index.jsx. · ./admin/default. · 21 lines · inside AdminLayout" /tmp/inspect-chakra.txt
          grep -q "views/auth/signIn/index.jsx. · ./auth/sign-in." /tmp/inspect-chakra.txt
          grep -q "colour scales (500 or middle step): brand #422AFB" /tmp/inspect-chakra.txt
          grep -q "component styles: Button" /tmp/inspect-chakra.txt
          grep -q "render dark with .--dark-storage chakra-ui-color-mode=dark." /tmp/inspect-chakra.txt
          grep -q "references/stacks/kits.md" /tmp/inspect-chakra.txt
          # styled-components: v5 <Route component>, the theme object, the keys components read, the dark theme and its key
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/styled-app | tee /tmp/inspect-styled.txt | head -5
          grep -q "styled-components in 7 files (global styles in .src/styles/GlobalStyle.ts.)" /tmp/inspect-styled.txt
          grep -q "scenes/Settings.tsx. · ./settings." /tmp/inspect-styled.txt
          grep -q "styled-components theme — .src/styles/theme.ts." /tmp/inspect-styled.txt
          grep -q "a dark theme (.darkTheme. in .src/styles/theme.ts.)" /tmp/inspect-styled.txt
          grep -q "render dark with .--dark-storage theme=dark." /tmp/inspect-styled.txt
          # CSS Modules: one module per component, the global variables, module classes left out of the vocabulary
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/cssmodules-app | tee /tmp/inspect-cssm.txt | head -5
          grep -q "CSS Modules: 3 .\.module\.\*. files, imported by 3 components" /tmp/inspect-cssm.txt
          grep -q "colours and spacing come from the variables in .src/index.css." /tmp/inspect-cssm.txt
          grep -q "Read next: the kit lines above" /tmp/inspect-cssm.txt
          # Element Plus: hash routes, extensionless and commented imports, routes the backend adds, useDark's key,
          # the dark variables, a runtime primary, the locale
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/element-app | tee /tmp/inspect-element.txt | head -5
          grep -q "Element Plus — its components by use" /tmp/inspect-element.txt
          grep -q ".dashboard. → src/views/dashboard.vue" /tmp/inspect-element.txt
          grep -q ".\/login. → src/views/login.vue" /tmp/inspect-element.txt
          grep -q "routes on the URL's hash" /tmp/inspect-element.txt
          grep -q "routes are also added at runtime" /tmp/inspect-element.txt
          grep -q "Element Plus's dark variables" /tmp/inspect-element.txt
          grep -q "render dark with .--dark-storage vueuse-color-scheme=dark." /tmp/inspect-element.txt
          grep -q "sets the .--el-color-\*. variables at runtime" /tmp/inspect-element.txt
          grep -q "locale zh-cn" /tmp/inspect-element.txt
          # Vuetify: both themes with their colours, the component defaults, the switch and its key
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/vuetify-app | tee /tmp/inspect-vuetify.txt | head -5
          grep -q "Vuetify — its components by use" /tmp/inspect-vuetify.txt
          grep -q ".light. (light, the default): primary #00695c" /tmp/inspect-vuetify.txt
          grep -q ".dark. (dark): primary #4db6ac" /tmp/inspect-vuetify.txt
          grep -q "component defaults: VBtn variant flat, rounded lg" /tmp/inspect-vuetify.txt
          grep -q "render dark with .--dark-storage app-theme=dark." /tmp/inspect-vuetify.txt
          # Laravel: routes to views (Route::view, controllers, a Livewire page, Fortify), middleware from groups and
          # controllers (except, only), @extends and component layouts, Blade components, Flux, Inertia, @vite
          python3 ui-craft/scripts/inspect.py ui-craft/evals/fixtures/laravel-app | tee /tmp/inspect-laravel.txt | head -5
          grep -q "Laravel .12.10 (Blade; Livewire 3, Inertia, Fortify; routes in .routes/web.php.)" /tmp/inspect-laravel.txt
          grep -q "reports/index.blade.php. · ./reports. · 11 lines · uses x-card · inside layouts.guest" /tmp/inspect-laravel.txt
          grep -q "reports/show.blade.php. · ./reports/{report}. · 6 lines · middleware auth" /tmp/inspect-laravel.txt
          grep -q "admin/users.blade.php. · ./admin/users. · 5 lines · middleware auth, can:manage-users" /tmp/inspect-laravel.txt
          grep -q "livewire/settings.blade.php. · ./settings. · 8 lines · form, Livewire page, middleware auth, verified" /tmp/inspect-laravel.txt
          grep -q "inside components.layouts.app → app-layout" /tmp/inspect-laravel.txt
          grep -q "auth/login.blade.php. · ./login. · 11 lines · form, Fortify view" /tmp/inspect-laravel.txt
          grep -q "card.blade.php. .<x-card>. (3; props title, padded)" /tmp/inspect-laravel.txt
          grep -q "Flux — its components by use: flux:input ×7" /tmp/inspect-laravel.txt
          grep -q "./analytics. → Inertia .Analytics." /tmp/inspect-laravel.txt
          grep -q "render dark through it: .--dark-storage flux.appearance=dark." /tmp/inspect-laravel.txt
          grep -q "Vite manifest not found" /tmp/inspect-laravel.txt
          grep -q "references/stacks/laravel.md" /tmp/inspect-laravel.txt
